# The sample rate the bridge STAMPS on this lane, not the bridge's
# configured target and not an average of what any one machine
# delivered. The launcher (Pilotage's build-xplane-plugins.sh) pins the
# installed bridge's `mavlink_sensor_rate_hz` to 100 when it installs
# the plugins; editing this field reconfigures nothing. On a display
# whose flight loop steps at 12.5 ms, the first whole frame that clears
# the 10 ms target is one frame, and the stamped period is 12.5 ms —
# this declaration. The install is stamp-gated on the launcher's own
# sources, and nothing checks the setting at launch or at run time, so a
# lane can still meet a bridge configured otherwise.
#
# What the runtime gate observes is not wall-clock delivery. It reads the
# simulation timestamps the bridge stamps. The bridge carries no phase
# between captures, so the stamped period is the first whole number of
# flight-loop frames that clears the target period: it sits at the target
# only when the flight loop runs at, or just above, an integer multiple
# of it; between multiples the capture stretches by up to a frame and the
# stamped rate falls below, and past the resampler's bound the split
# raises it above. The gate refusing those is the point: a sample clock
# set by frame timing rather than by this target is not one plant
# identification can trust.
#
# An average of delivered samples taken under load therefore describes the
# machine during the measurement, not the lane, and a declaration built
# from one refuses healthy runs while accepting degraded ones.
sample_rate_hz = 80
max_samples_per_iteration = 32
# Mixer lane for each simulator actuator lane, checked against the aircraft
# file rather than assumed. ALIA-250.acf places its lift rotors at
# _engn/0 (x +8.5, z -9.98) front-right, _engn/1 (-8.5, -9.98) front-left,
# _engn/2 (-8.5, +9.98) rear-left, _engn/3 (+8.5, +9.98) rear-right — X-Plane
# part coordinates being starboard-positive and aft-positive. The mixer emits
# gz/PX4 order (FR, RL, FL, RR), so this gather delivers FR, FL, RL, RR, which
# is what those engine indices are.
#
# The permutation is self-inverse, so reading it as a scatter gives the same
# answer here and would not reveal a direction error. It agrees because the
# positions agree, not because the shape is forgiving.
#
# _prop_dir is -1, +1, -1, +1 across those four, putting FR+RL on one sense and
# FL+RR on the other — the diagonal `quad-x-x500-reversed-spin` declares.
lane_order = [0, 2, 1, 3]

# These values protect the simulator plant. The tuner cannot change them.
[wire]
rise_per_s = 0.5
band_boundary = 0.40
low_band_rise_per_s = 0.6
fall_per_s = 0.30
mean_ceiling = 0.55
lane_ceiling = 0.85
airborne_clearance_m = 0.5
ground_squeeze = 0.5
max_sample_dt_s = 0.05
