# What X-Plane actually delivers for this aircraft, rather than what would be
# convenient. Measured over five runs on an M3 Max: 88.3, 90.0, 93.1, 93.4 and
# 96.7 Hz.
#
# Two facts decide this number. The rate is bounded by the flight model and not
# by rendering — shrinking the window from 1400x900 to 1024x640 moved it
# 93.1 -> 93.4 Hz — so it cannot be bought with graphics settings. And it VARIES
# run to run by about nine percent end to end, which is most of the board's own
# five percent tolerance, so the declared rate has to sit where the whole spread
# fits rather than at any single observation. 92 is the only integer that puts
# all five inside; 91 and 93 each leave one outside, and 100 left every one of
# them outside.
#
# The margin is thin by construction. A slower frame than any yet seen will
# still be refused, and that refusal is the board doing its job: a run whose
# sample clock wandered is a run whose plant identification cannot be trusted.
sample_rate_hz = 92
max_samples_per_iteration = 32
# Mixer lane for each simulator actuator lane, checked against the aircraft
# file rather than assumed. ALIA-250.acf places its lift rotors at
# _engn/0 (x +8.5, z -9.98) front-right, _engn/1 (-8.5, -9.98) front-left,
# _engn/2 (-8.5, +9.98) rear-left, _engn/3 (+8.5, +9.98) rear-right — X-Plane
# part coordinates being starboard-positive and aft-positive. The mixer emits
# gz/PX4 order (FR, RL, FL, RR), so this gather delivers FR, FL, RL, RR, which
# is what those engine indices are.
#
# The permutation is self-inverse, so reading it as a scatter gives the same
# answer here and would not reveal a direction error. It agrees because the
# positions agree, not because the shape is forgiving.
#
# _prop_dir is -1, +1, -1, +1 across those four, putting FR+RL on one sense and
# FL+RR on the other — the diagonal `quad-x-x500-reversed-spin` declares.
lane_order = [0, 2, 1, 3]

# These values protect the simulator plant. The tuner cannot change them.
[wire]
rise_per_s = 0.035
band_boundary = 0.40
low_band_rise_per_s = 0.15
fall_per_s = 0.30
mean_ceiling = 0.55
lane_ceiling = 0.85
airborne_clearance_m = 0.5
ground_squeeze = 0.5
max_sample_dt_s = 0.05
