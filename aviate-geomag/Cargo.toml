[package]
publish = false  # internal crate — not released to crates.io
name = "aviate-geomag"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
description = "World Magnetic Model (WMM2025) evaluator: the Earth's main magnetic field at a geodetic point and date"
repository.workspace = true
categories = ["no-std", "science::geo"]
keywords = ["geomagnetism", "wmm", "declination", "no-std"]

[dependencies]
# Pure-Rust, dependency-free libm: `core` has no f64 transcendentals on
# the embedded targets, and hand-written ones would be a second
# numerical implementation to qualify.
libm = "0.2"

[lints]
workspace = true
