[package]
publish = false  # internal crate — not released to crates.io
name = "aviate-app-sitl-jsbsim-x500"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "X500 quadcopter FC binary for the JSBSim SITL board"

[[bin]]
name = "sitl-jsbsim-x500"
path = "src/main.rs"

[dependencies]
# The X500 kernel: the airframe's gains, mixer and resolved config,
# shared with the Gazebo X500 app so both fly the same controller.
aviate-app-sitl-gazebo-x500-kernel = { path = "../sitl-gazebo-x500/kernel" }
aviate-core = { path = "../../aviate-core" }
aviate-board-sitl-jsbsim = { path = "../../aviate-boards/sitl-jsbsim" }
# App configuration (telemetry endpoint + rates): parsed once at
# startup from the embedded AviateApp.toml.
aviate-config = { path = "../../aviate-config" }
aviate-hal-xil = { path = "../../aviate-hal/xil" }
# The date the simulated Earth field is evaluated on.
world-core.workspace = true
log = "0.4"
env_logger = "0.11"

[lints]
workspace = true
