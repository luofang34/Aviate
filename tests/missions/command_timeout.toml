# Aviate SITL Test: Command Timeout (HLR-FLT-204 / LLR-FLT-207)
#
# Tests the integrated path for the command-staleness check: when
# the FC stops receiving fresh FlightControl setpoints (only
# heartbeats), the kernel's `command_age_ms` accumulates and the
# `COMMAND_RECENT` in-flight check clears. The vehicle should
# remain armed (command staleness is recoverable, not a fault) and
# the kernel should continue to emit a defined actuator pattern.
#
# Unit-tier coverage: TST-FLT-207 (kernel.rs::update_command_age_
# gates_command_recent_flag) verifies the cycle-level clear and the
# boundary case. This scenario exercises the same logic through the
# simulator backend, against simulated physics.
#
# Flown under position control (PositionHold targets) wherever the
# vehicle holds or lands, so the profile holds on any plant and ends in
# a verified touchdown.

[test]
name = "command_timeout"
description = "Vehicle stays armed when commands stop arriving"
lockstep = true

[[vehicles]]
id = "x500"
model = "x500"
instance = 0
spawn_position = [0.0, 0.0, 0.0]
spawn_heading = 0.0

[vehicles.mission]
name = "command_timeout_test"

# Arm.
[[vehicles.mission.phases]]
name = "arm"
duration_ms = 500
action = { type = "arm" }
verify = [{ type = "armed", value = true }]

# Take off to 5 m.
[[vehicles.mission.phases]]
name = "takeoff"
duration_ms = 8000
action = { type = "goto", position = [0.0, 0.0, -5.0], heading = 0.0 }
verify = [{ type = "min_altitude", value = 3.0 }]

# No setpoints, heartbeats only: the command ages past its timeout and
# the vehicle stays armed (staleness is recoverable, not a fault).
[[vehicles.mission.phases]]
name = "wait_no_command"
duration_ms = 4000
action = { type = "wait" }
verify = [{ type = "armed", value = true }]

# Setpoints resume.
[[vehicles.mission.phases]]
name = "resume_command"
duration_ms = 3000
action = { type = "goto", position = [0.0, 0.0, -5.0], heading = 0.0 }
verify = [{ type = "armed", value = true }]

# Land under position control: the touchdown is verified, so the
# disarm that follows is a landed vehicle's.
[[vehicles.mission.phases]]
name = "land"
duration_ms = 12000
action = { type = "goto", position = [0.0, 0.0, 0.0], heading = 0.0 }
verify = [{ type = "touchdown_velocity", max_descent_mps = 1.0, ground_tolerance = 0.30 }]

[[vehicles.mission.phases]]
name = "disarm"
duration_ms = 500
action = { type = "disarm" }
verify = [{ type = "armed", value = false }]
