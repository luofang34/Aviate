# Aviate SITL Test: GNSS Dropout Dead-Reckoning
#
# Witnesses HLR-EST-205 / LLR-EST-206: estimator survives a bounded
# GNSS dropout window without divergence. The vehicle takes off,
# hovers to converge the estimator, then GNSS health drops to Lost
# for 5 seconds; the kernel must continue producing finite output
# without latching numeric faults.
#
# Tolerance bounds carry forward from HLR-EST-205:
#   - horizontal drift over the 5 s dropout window ≤ 2.0 m
#   - estimator does not produce numeric fault
#   - attitude (independent of GNSS) tracks normally throughout
#
# Flown under position control (PositionHold targets) wherever the
# vehicle holds or lands, so the profile holds on any plant and ends in
# a verified touchdown.

[test]
name = "gnss_dropout"
description = "Estimator dead-reckoning under bounded GNSS dropout"
lockstep = true

[[vehicles]]
id = "x500"
model = "x500"
instance = 0
spawn_position = [0.0, 0.0, 0.0]
spawn_heading = 0.0

[vehicles.mission]
name = "gnss_dropout_test"

# Arm.
[[vehicles.mission.phases]]
name = "arm"
duration_ms = 500
action = { type = "arm" }
verify = [{ type = "armed", value = true }]

# Take off to 10 m and let the estimator settle.
[[vehicles.mission.phases]]
name = "takeoff"
duration_ms = 10000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [{ type = "min_altitude", value = 8.0 }]

# Estimator warmup.
[[vehicles.mission.phases]]
name = "hover_warmup"
duration_ms = 3000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [{ type = "armed", value = true }]

# GNSS health drops to Lost. The bounded-drift cert property
# (HLR-EST-205, <= 2 m over 5 s) is verified at the unit tier by
# behavioral_tests::ekf_gnss_dropout_bounded_dead_reckoning_drift; here
# the kernel must stay armed and bounded, and recover.
[[vehicles.mission.phases]]
name = "inject_gnss_lost"
duration_ms = 100
action = { type = "inject_fault", sensor = "gnss", fault = "health_failed" }
verify = [{ type = "armed", value = true }]

[[vehicles.mission.phases]]
name = "hover_under_dropout"
duration_ms = 5000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [
    { type = "armed", value = true },
    { type = "max_excursion", center = [0.0, 0.0, -10.0], xy_max = 10.0, z_max = 6.0 },
]

# GNSS returns; the innovation gate (LLR-EST-207) limits the
# resume-step state delta.
[[vehicles.mission.phases]]
name = "clear_faults"
duration_ms = 100
action = { type = "clear_faults" }
verify = [{ type = "armed", value = true }]

[[vehicles.mission.phases]]
name = "hover_after_recovery"
duration_ms = 3000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [
    { type = "armed", value = true },
    { type = "max_excursion", center = [0.0, 0.0, -10.0], xy_max = 10.0, z_max = 6.0 },
]

# Land under position control: the touchdown is verified, so the
# disarm that follows is a landed vehicle's.
[[vehicles.mission.phases]]
name = "land"
duration_ms = 12000
action = { type = "goto", position = [0.0, 0.0, 0.0], heading = 0.0 }
verify = [{ type = "touchdown_velocity", max_descent_mps = 1.0, ground_tolerance = 0.30 }]

[[vehicles.mission.phases]]
name = "disarm"
duration_ms = 500
action = { type = "disarm" }
verify = [{ type = "armed", value = false }]
