# Aviate SITL Test: Basic Flight
#
# Fundamental flight test for SITL verification.
# Tests basic motor control, takeoff, and landing.
#
# This is the simplest test - if this fails, nothing else will work.
# Used as a smoke test before running more complex tests.
#
# Flown under position control (PositionHold targets) wherever the
# vehicle holds or lands, so the profile holds on any plant and ends in
# a verified touchdown.

[test]
name = "basic_flight"
description = "Basic single vehicle flight test (takeoff and land)"
lockstep = true

# Note: World file is generated dynamically based on vehicles and lockstep settings

[[vehicles]]
id = "x500"
model = "x500"
instance = 0
spawn_position = [0.0, 0.0, 0.0]
spawn_heading = 0.0

[vehicles.mission]
name = "basic_takeoff_land"

# Arm.
[[vehicles.mission.phases]]
name = "arm"
duration_ms = 500
action = { type = "arm" }
verify = [{ type = "armed", value = true }]

# Climb on open-loop collective thrust: the attitude/thrust path.
[[vehicles.mission.phases]]
name = "takeoff"
duration_ms = 3000
action = { type = "thrust", value = 0.64 }
verify = [
    { type = "min_altitude", value = 0.1 },
    { type = "velocity_tracks_position", tolerance = 0.25 },
]

# Hover at 5 m.
[[vehicles.mission.phases]]
name = "hover"
duration_ms = 5000
action = { type = "goto", position = [0.0, 0.0, -5.0], heading = 0.0 }
verify = [
    { type = "armed", value = true },
    { type = "min_altitude", value = 3.0 },
    { type = "attitude_bounded", roll_pitch_max_deg = 25.0 },
]

# Land under position control: the touchdown is verified, so the
# disarm that follows is a landed vehicle's.
[[vehicles.mission.phases]]
name = "land"
duration_ms = 12000
action = { type = "goto", position = [0.0, 0.0, 0.0], heading = 0.0 }
verify = [{ type = "touchdown_velocity", max_descent_mps = 1.0, ground_tolerance = 0.30 }]

[[vehicles.mission.phases]]
name = "disarm"
duration_ms = 500
action = { type = "disarm" }
verify = [{ type = "armed", value = false }]
