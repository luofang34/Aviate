# Aviate SITL Test: Hover Stability
#
# Tests altitude hold and horizontal stability (AVIATE_SPEC.md Section 12)
# Verifies: AltitudeHold control mode, state estimation, stabilization
#
# Expected behavior:
#   - Takeoff to 10m
#   - Maintain altitude within 1m tolerance
#   - Maintain horizontal position within 2m drift
#   - Controlled descent and land
#
# Flown under position control (PositionHold targets) wherever the
# vehicle holds or lands, so the profile holds on any plant and ends in
# a verified touchdown.

[test]
name = "hover_stability"
description = "Verify altitude hold and position stability during hover"
lockstep = true

# Note: World file is generated dynamically based on vehicles and lockstep settings

[[vehicles]]
id = "x500"
model = "x500"
instance = 0
spawn_position = [0.0, 0.0, 0.0]
spawn_heading = 0.0

[vehicles.mission]
name = "hover_stability_test"

# Arm.
[[vehicles.mission.phases]]
name = "arm"
duration_ms = 500
action = { type = "arm" }
verify = [{ type = "armed", value = true }]

# Climb to 10 m.
[[vehicles.mission.phases]]
name = "takeoff"
duration_ms = 10000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [
    { type = "min_altitude", value = 8.0 },
    { type = "attitude_bounded", roll_pitch_max_deg = 25.0 },
]

# Hold 10 m: altitude within 1 m, horizontal drift within 2 m.
[[vehicles.mission.phases]]
name = "hover_hold"
duration_ms = 8000
action = { type = "goto", position = [0.0, 0.0, -10.0], heading = 0.0 }
verify = [
    { type = "altitude_hold", target = 10.0, tolerance = 1.0 },
    { type = "max_drift", value = 2.0 },
]

# Land under position control: the touchdown is verified, so the
# disarm that follows is a landed vehicle's.
[[vehicles.mission.phases]]
name = "land"
duration_ms = 12000
action = { type = "goto", position = [0.0, 0.0, 0.0], heading = 0.0 }
verify = [{ type = "touchdown_velocity", max_descent_mps = 1.0, ground_tolerance = 0.30 }]

[[vehicles.mission.phases]]
name = "disarm"
duration_ms = 500
action = { type = "disarm" }
verify = [{ type = "armed", value = false }]
