[package]
publish = false  # internal crate — not released to crates.io
name = "aviate-security"
version = "0.1.0"
edition = "2021"
authors = ["Aviate Contributors"]
license = "MIT OR Apache-2.0"
description = "Security policy layer for Aviate flight control system"
keywords = ["embedded", "security", "authentication", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = []
# Compiles `FailsafeAuthority::take`, required to mint
# `TrustedInternalCommand`s. Enabled ONLY by the runtime failsafe
# subsystem. NOTE: because Cargo unifies features across the graph, this
# gate only prunes API surface — the authority itself is bounded by
# `take()` handing out the capability at most once per process.
internal-failsafe = []
# Compiles the insecure development surface: `PlainAuth`,
# `SourcePolicy::insecure_dev`, and `UnverifiedSystemCommand::unsigned_dev`.
# For SITL/bench assemblies only; a flight build that never enables this
# cannot name an authentication bypass.
insecure-dev-auth = []

[dependencies]
aviate-hal-io = { path = "../aviate-hal/io" }
aviate-link = { path = "../aviate-link" }

[dev-dependencies]
# Real SHA-256 for interoperability tests against pymavlink golden
# vectors; the in-crate MockCrypto stays crypto-free.
sha2 = { version = "0.11", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
